[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "remagic"
version = "0.2.0"
description = "Build regular expressions from composable, typed Python objects."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Ificiana", email = "ificiana@gmail.com" }]
keywords = ["regex", "regexp", "remagic"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
regex = ["regex>=2024.11.6"]

[project.urls]
Homepage = "https://github.com/ificiana/remagic"
Documentation = "https://ificiana.github.io/remagic"
Repository = "https://github.com/ificiana/remagic"

[dependency-groups]
dev = [
  "hypothesis>=6.120",
  "mypy>=1.14",
  "pre-commit>=4.0",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "regex>=2024.11.6",
  "ruff>=0.9",
]
docs = [
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/remagic"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF", "PT", "D", "S"]
ignore = ["D105", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = ["--strict-markers", "--doctest-modules", "--cov", "--cov-report=term-missing"]

[tool.coverage.run]
source = ["remagic"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
