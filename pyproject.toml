[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[project]
name = "remagic"
version = "0.2.0b1"
description = "Build regular expressions from composable, typed Python objects."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Ificiana", email = "ificiana@gmail.com" }]
keywords = ["regex", "regexp", "remagic"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
regex = ["regex>=2026.9.29"]

[project.urls]
Homepage = "https://github.com/ificiana/remagic"
Documentation = "https://ificiana.github.io/remagic"
Repository = "https://github.com/ificiana/remagic"

[dependency-groups]
dev = [
  "hypothesis>=6.168",
  "mypy>=2.4",
  "pre-commit>=4.6",
  "pytest>=9.1",
  "pytest-cov>=7.1",
  "regex>=2026.9.29",
  "ruff>=0.16",
]
docs = [
  "shibuya>=2026.7; python_version >= '3.12'",
  "myst-parser>=5.1; python_version >= '3.12'",
  "sphinx>=9.1; python_version >= '3.12'",
  "sphinx-autodoc-typehints>=3.13; python_version >= '3.12'",
  "sphinx-copybutton>=0.5; python_version >= '3.12'",
]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF", "PT", "D", "S"]
ignore = ["D105", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101"]
"benchmarks/**" = ["S311"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests", "src", "docs", "README.md"]
addopts = ["--strict-markers", "--doctest-modules",
  "--doctest-glob=*.md", "--cov", "--cov-report=term-missing"]

[tool.coverage.run]
source = ["remagic"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
